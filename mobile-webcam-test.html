<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KineticAI Webcam Test</title>
    <style>
      :root {
        --bg-dark: #0b1020;
        --bg-soft: #1b243a;
        --panel: rgba(15, 23, 42, 0.78);
        --white: #f8fafc;
        --muted: #cbd5e1;
        --accent: #3182ce;
        --accent-strong: #2563eb;
        --danger: #ef4444;
        --success: #22c55e;
        --warning: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--white);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .phone-shell {
        width: min(94vw, 1280px);
        aspect-ratio: 16 / 9;
        max-height: 88vh;
        border-radius: 24px;
        padding: 12px;
        background: linear-gradient(180deg, #111827, #030712);
        box-shadow: 0 28px 60px var(--shadow);
        position: relative;
      }

      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
        background: #000;
        border: 2px solid rgba(255,255,255,0.08);
      }

      .video-wrap {
        position: absolute;
        inset: 0;
        background: #111;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
        background: #000;
        aspect-ratio: 16 / 9;
      }

      .camera-overlay {
        position: absolute;
        inset: 0;
        border: 8px solid transparent;
        pointer-events: none;
        transition: border-color 0.2s ease;
      }

      .camera-overlay.red { border-color: #ef4444; }
      .camera-overlay.blue { border-color: #3b82f6; }
      .camera-overlay.green { border-color: #22c55e; }
      .camera-overlay.transparent { border-color: transparent; }

      .top-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 12px 0;
        z-index: 3;
      }
 
      .exercise-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
 
      .exercise-btn {
        background: rgba(15, 23, 42, 0.62);
        color: var(--white);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 7px 9px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .exercise-btn.active {
        background: var(--accent);
        border-color: rgba(255,255,255,0.28);
      }

      .feedback-box {
        margin-top: 10px;
        background: rgba(15, 23, 42, 0.74);
        border-radius: 12px;
        padding: 10px 12px;
        text-align: center;
        backdrop-filter: blur(5px);
      }

      .feedback-message {
        font-size: 15px;
        font-weight: 700;
        color: var(--white);
        line-height: 1.3;
      }

      .count-label {
        margin-top: 6px;
        font-size: 16px;
        color: #facc15;
        font-weight: 800;
      }

      .bottom-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        display: flex;
        justify-content: center;
        z-index: 3;
      }

      .action-btn {
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: white;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
      }

      .action-btn.stop {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
      }

      .status-badge {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 4;
        background: rgba(2, 6, 23, 0.7);
        color: var(--white);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 700;
      }

      .status-badge.live {
        color: #86efac;
      }

      .status-badge.offline {
        color: #fca5a5;
      }

      @media (max-width: 420px) {
        body { padding: 8px; }
        .phone-shell { width: 100vw; height: calc(100vh - 16px); border-radius: 0; padding: 0; }
        .phone-screen { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone-screen">
        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
        </div>

        <div id="statusBadge" class="status-badge offline">OFFLINE</div>
        <div class="camera-overlay transparent" id="borderOverlay"></div>

        <div class="top-panel">
          <div class="exercise-row" id="exerciseRow"></div>

          <div class="feedback-box">
            <div class="feedback-message" id="feedbackMessage">원하는 운동을 고르고 촬영을 시작하세요.</div>
            <div class="count-label" id="countLabel" style="display: none;">0</div>
          </div>
        </div>
        
        <div class="bottom-panel">
          <button id="toggleBtn" class="action-btn">촬영 시작</button>
        </div>
      </div>
    </div>

    <script>
      const EXERCISES = ['풀업', '딥스', '푸쉬업', '플랭크', '사이드 런지'];
      const exerciseRow = document.getElementById('exerciseRow');
      const feedbackMessage = document.getElementById('feedbackMessage');
      const countLabel = document.getElementById('countLabel');
      const toggleBtn = document.getElementById('toggleBtn');
      const video = document.getElementById('video');
      const borderOverlay = document.getElementById('borderOverlay');
      const statusBadge = document.getElementById('statusBadge');

      const FRAME_BUFFER_LIMIT = 60;
      const CAPTURE_WIDTH = 1920;
      const CAPTURE_HEIGHT = 1080;

      let selectedExercise = '풀업';
      let stream = null;
      let socket = null;
      let frameTimer = null;
      let isStreaming = false;
      let countdownTimer = null;
      let countdownValue = 10;
      let currentFeedback = '원하는 운동을 고르고 촬영을 시작하세요.';
      let frameBuffer = [];
      let isExerciseStarted = false;
      let countdownStartTimer = null;
      let countdownSequenceStarted = false;

      const metronomeState = {
        timerId: null,
        cycleIndex: 0,
        intervalMs: 6000,
        audioCtx: null,
        pendingTimeouts: []
      };

      function renderExercises() {
        exerciseRow.innerHTML = '';
        EXERCISES.forEach((exercise) => {
          const button = document.createElement('button');
          button.className = 'exercise-btn' + (exercise === selectedExercise ? ' active' : '');
          button.textContent = exercise;
          button.onclick = () => {
            if (!isStreaming) {
              selectedExercise = exercise;
              renderExercises();
              feedbackMessage.textContent = `${exercise} 운동을 선택했습니다.`;
            }
          };
          exerciseRow.appendChild(button);
        });
      }

      function updateBorder(color = 'transparent') {
        borderOverlay.className = `camera-overlay ${color}`;
      }

      function updateStatus(connected) {
        statusBadge.textContent = connected ? 'LIVE' : 'OFFLINE';
        statusBadge.className = `status-badge ${connected ? 'live' : 'offline'}`;
      }

      function updateCountUi(count) {
        const normalized = Number(count);
        if (!Number.isFinite(normalized) || normalized < 0) return;

        countLabel.style.display = 'block';
        countLabel.textContent = `현재 횟수: ${normalized}`;
        feedbackMessage.textContent = `${selectedExercise} ${normalized}회`;
      }

      function ensureAudioContext() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;

        if (!metronomeState.audioCtx) {
          metronomeState.audioCtx = new AudioCtor();
        }

        if (metronomeState.audioCtx.state === 'suspended') {
          metronomeState.audioCtx.resume();
        }

        return metronomeState.audioCtx;
      }

      function playClickTone(frequency = 880, duration = 0.12, volume = 0.06) {
        const audioContext = ensureAudioContext();
        if (!audioContext) return;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = 'square';
        oscillator.frequency.value = frequency;

        gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration + 0.02);
      }

      function toKoreanCount(value) {
          if (value === 100) return '백';
          if (value <= 0) return String(value);

          const units = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];

          const tens = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔'];

          const t = Math.floor(value / 10); // 십의 자리 인덱스 (예: 25 / 10 = 2)
          const u = value % 10;       // 일의 자리 인덱스 (예: 25 % 10 = 5)

          return tens[t] + units[u];
      }

      function speakNumber(value, isCountdown = false) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 1) return;

        if (!('speechSynthesis' in window)) return;

        const spokenValue = (() => {
          if (isCountdown) {
            if (number > 5) return '';
            switch (number) {
              case 1: return '일';
              case 2: return '이';
              case 3: return '삼';
              case 4: return '사';
              case 5: return '오';
              default: return '';
            }
          }

          if (number > 100) return '';
          return toKoreanCount(number);
        })();

        if (!spokenValue) return;

        const utterance = new SpeechSynthesisUtterance(spokenValue);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.5;
        utterance.pitch = 1.0;
        utterance.volume = 1;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }

      /**
       * 함수 설명: 메트로놈 1초 간격의 삑소리와 숫자 음성을 순차적으로 실행
       * 
       * 추가 설명: 2개의 메트로놈 변수와 한개의 횟수 음성을 1초마다 실행하도록 세팅 후 재귀함수로 100회까지 진행이 됨
       */
      function runMetronomeCycle() {
        if (!isStreaming) return;

        const currentCount = metronomeState.cycleIndex + 1;
        if (currentCount > 100) {
          stopMetronome();
          return;
        }

        const clickOne = setTimeout(() => {
          if (!isStreaming) return;
          playClickTone(880, 0.12, 0.08);
        }, 0);

        const clickTwo = setTimeout(() => {
          if (!isStreaming) return;
          playClickTone(880, 0.12, 0.08);
        }, 1300);

        const speakTimer = setTimeout(() => {
          if (!isStreaming) return;
          speakNumber(currentCount);

          // 100("백") 음성이 끝까지 재생되도록 1초 뒤 종료
          if (currentCount >= 100) {
            const finishTimer = setTimeout(() => {
              stopMetronome();
            }, 1000);
            metronomeState.pendingTimeouts.push(finishTimer);
          }
        }, 2600);

        metronomeState.pendingTimeouts.push(clickOne, clickTwo, speakTimer);

        if (currentCount < 100) {
          metronomeState.cycleIndex = currentCount;
          const nextCycleTimer = setTimeout(() => {
            if (!isStreaming) return;
            runMetronomeCycle();
          }, 3900);

          metronomeState.timerId = nextCycleTimer;
          metronomeState.pendingTimeouts.push(nextCycleTimer);
        } else {
          metronomeState.cycleIndex = 100;
          }
}

      /**
       * 함수 설명: 메트로놈 타이머를 초기화하고 1~100까지 순차적으로 음성/삑소리를 실행
       */
      function startMetronome() {
        stopMetronome();
        metronomeState.cycleIndex = 0;

        const initialDelayTimer = setTimeout(() => {
          if (!isStreaming) return;
          runMetronomeCycle();
        }, 2000);

        metronomeState.pendingTimeouts.push(initialDelayTimer);
      }

      function stopMetronome() {
        if (metronomeState.timerId) {
          clearInterval(metronomeState.timerId);
          metronomeState.timerId = null;
        }

        metronomeState.pendingTimeouts.forEach((timeoutId) => clearTimeout(timeoutId));
        metronomeState.pendingTimeouts = [];

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
      
      /**
       * 백엔드 실시간 연결 및 백엔드 데이터를 받아오는 함수
       */
      function ensureSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) return socket;

        socket = new WebSocket('ws://localhost:8000/api/video/ws/video');

        socket.onopen = () => {
          console.log('백엔드 WebSocket 연결 성공');
          updateStatus(true);
        };

        socket.onclose = () => {
          console.log('백엔드 WebSocket 연결 종료');
          updateStatus(false);
          isStreaming = false;
          toggleBtn.textContent = '촬영 시작';
          toggleBtn.classList.remove('stop');
          stopMetronome();
          stopCamera();
        };

        socket.onerror = (error) => {
          console.error('WebSocket 오류:', error);
          feedbackMessage.textContent = '서버 연결에 실패했습니다. 백엔드가 실행 중인지 확인하세요.';
          updateStatus(false);
        };

        socket.onmessage = (event) => {
          try {
            const result = JSON.parse(event.data);
            if (result.status === 'count' || result.type === 'count' || result.signal === 'COUNT_SUCCESS') {
              const count = Number(result.count ?? 0);
              if (Number.isFinite(count) && count >= 0) {
                updateCountUi(count);
              }
            }
          } catch (error) {
            console.log('WebSocket 메시지 파싱 실패:', error);
          }
        };

        return socket;
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          feedbackMessage.textContent = '이 브라우저는 웹캠을 지원하지 않습니다.';
          return false;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              // LSTM 데이터 수집을 1920 x 1080 으로 세팅
              width: { ideal: 1920, max: 1920 },
              height: { ideal: 1080, max: 1080 },
              aspectRatio: 1.7777777778
            },
            audio: false
          });

          video.srcObject = stream;
          await video.play();
          ensureSocket();
          frameBuffer = [];
          isExerciseStarted = false;
          startFrameLoop();
          isStreaming = true;
          toggleBtn.textContent = '촬영 중지';
          toggleBtn.classList.add('stop');
          updateBorder('transparent');
          return true;
        } catch (error) {
          console.error('웹캠 접근 실패:', error);
          feedbackMessage.textContent = '웹캠 권한을 허용해 주세요.';
          return false;
        }
      }

      function stopCamera() {
        if (frameTimer) {
          clearInterval(frameTimer);
          frameTimer = null;
        }

        stopCountdown();

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }

        if (video) {
          video.srcObject = null;
        }

        frameBuffer = [];
        isExerciseStarted = false;
        stopMetronome();
        isStreaming = false;
        countLabel.style.display = 'none';
        updateBorder('transparent');
      }
      
      /**
       * 함수 설명: 초기 60프레임을 한번에 전송하는 함수
       * 
       * 추가 설명: sendFrameToServer() 함수와 분리한 이유는 60프레임을 보내는 부분이 한번만 쓰이고 가독성을 위해 분리함
       */
      function flushFrameBuffer() {
        if (!frameBuffer.length) return;

        if (socket && socket.readyState === WebSocket.OPEN) {
          frameBuffer.forEach((frame) => {
            socket.send(frame);
          });
        }

        frameBuffer = [];
      }
      /**
       * 함수 설명: 카운트 다운이 진행될 때, 초기에 백엔드로 보낼 60프레임을 미리 쌓아놓는 함수
       * 함수 목적: 초기에 60프레임까지 쌓는데 많은 시간이 소요되므로 대기 시간을 확보하기 위함
       * 
       * 추가 설명: 60프레임을 쌓는 것과 추후 운동 시작 시 프레임을 백엔드에 보내는 것만 담당
       *           초기 60프레임을 한번에 보내는 것은 flushFrameBuffer() 함수에서 진행 
       */
      function sendFrameToServer() {
        if (!video || video.readyState < 2) return;

        const canvas = document.createElement('canvas');
        canvas.width = CAPTURE_WIDTH;
        canvas.height = CAPTURE_HEIGHT;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, CAPTURE_WIDTH, CAPTURE_HEIGHT);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const base64 = dataUrl.split(',')[1];
        if (!base64) return;

        frameBuffer.push(base64);
        if (frameBuffer.length > FRAME_BUFFER_LIMIT) {
          frameBuffer.shift();
        }

        if (isExerciseStarted && socket && socket.readyState === WebSocket.OPEN) {
          socket.send(base64);
        }
      }
      /**
       * 함수 설명: sendFrameToServer를 33.3ms 마다 호출
       */ 
      function startFrameLoop() {
        frameTimer = setInterval(sendFrameToServer, 1000 / 30);
      }

      function stopSpeechQueue() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
      /**
       * 함수 설명: 안내 멘트가 끝난 직후 10초 준비 카운트다운을 진행 및
       *           0초가 되는 순간 모아둔 초기 프레임 전송,실시간 분석 시작,메트로놈 가동
       */

      function beginCountdownSequence() {
        if (countdownSequenceStarted || !isStreaming) return;
        countdownSequenceStarted = true;

        countdownValue = 10;
        const showCountdown = (value) => {
          feedbackMessage.textContent = `운동을 준비하세요. ${value}초 남았습니다.`;
        };

        showCountdown(countdownValue);

        countdownTimer = setInterval(() => {
          if (!isStreaming) return;

          countdownValue -= 1;

          if (countdownValue >= 6) {
            showCountdown(countdownValue);
            return;
          }

          if (countdownValue >= 1) {
            showCountdown(countdownValue);
            speakNumber(countdownValue, true);
            return;
          }

          clearInterval(countdownTimer);
          countdownTimer = null;
          flushFrameBuffer();
          isExerciseStarted = true;
          startMetronome();
          feedbackMessage.textContent = `${selectedExercise} 운동을 시작합니다.`;
        }, 1000);
      }

      function speakGuideMessage(text) {
        if (!('speechSynthesis' in window)) {
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1;

        utterance.onend = () => {
          if (!isStreaming || countdownSequenceStarted) return;
          clearTimeout(countdownStartTimer);
          countdownStartTimer = null;
          beginCountdownSequence();
        };

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }

      function stopCountdown() {
        if (countdownStartTimer) {
          clearTimeout(countdownStartTimer);
          countdownStartTimer = null;
        }

        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }

        countdownSequenceStarted = false;
        stopSpeechQueue();
      }

      async function startCountdown() {
        stopCountdown();
        countdownSequenceStarted = false;

        // AudioContext 초기화를 미리 준비해 첫 박자가 약해지거나 간격이 줄어드는 문제를 방지
        ensureAudioContext();

        if (!(await startCamera())) {
          return;
        }

        const guideText = '삑 삑 소리에 맞춰서 내려갔다가 올라오세요. 10초 카운트 다운을 시작합니다.';
        feedbackMessage.textContent = guideText;

        // 안전장치: 안내 멘트가 끝난 직후 10초 카운트다운이 진행되도록 타이머 설정
        countdownStartTimer = setTimeout(() => {
          if (!isStreaming || countdownSequenceStarted) return;
          clearTimeout(countdownStartTimer);
          countdownStartTimer = null;
          beginCountdownSequence();
        }, 12000);

        speakGuideMessage(guideText);
      }

      function handleToggle() {
        if (isStreaming) {
          stopCamera();
          stopCountdown();
          stopSpeechQueue();
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
          }
          toggleBtn.textContent = '촬영 시작';
          toggleBtn.classList.remove('stop');
          feedbackMessage.textContent = '촬영이 종료되었습니다.';
          return;
        }

        if (!selectedExercise) {
          feedbackMessage.textContent = '먼저 운동을 선택하세요.';
          return;
        }

        startCountdown();
      }

      toggleBtn.addEventListener('click', handleToggle);

      renderExercises();
      updateStatus(false);
      feedbackMessage.textContent = '원하는 운동을 고르고 촬영을 시작하세요.';
    </script>
  </body>
</html>
