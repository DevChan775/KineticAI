<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KineticAI Webcam Test</title>
    <style>
      :root {
        --bg-dark: #0b1020;
        --bg-soft: #1b243a;
        --panel: rgba(15, 23, 42, 0.78);
        --white: #f8fafc;
        --muted: #cbd5e1;
        --accent: #3182ce;
        --accent-strong: #2563eb;
        --danger: #ef4444;
        --success: #22c55e;
        --warning: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--white);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .phone-shell {
        width: 390px;
        height: 844px;
        max-width: 100%;
        max-height: 100vh;
        border-radius: 38px;
        padding: 14px;
        background: linear-gradient(180deg, #111827, #030712);
        box-shadow: 0 28px 60px var(--shadow);
        position: relative;
      }

      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background: #000;
        border: 2px solid rgba(255,255,255,0.08);
      }

      .video-wrap {
        position: absolute;
        inset: 0;
        background: #111;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
        background: #000;
      }

      .camera-overlay {
        position: absolute;
        inset: 0;
        border: 8px solid transparent;
        pointer-events: none;
        transition: border-color 0.2s ease;
      }

      .camera-overlay.red { border-color: #ef4444; }
      .camera-overlay.blue { border-color: #3b82f6; }
      .camera-overlay.green { border-color: #22c55e; }
      .camera-overlay.transparent { border-color: transparent; }

      .top-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 18px 16px 0;
        z-index: 3;
      }
 
      .exercise-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
 
      .exercise-btn {
        background: rgba(15, 23, 42, 0.62);
        color: var(--white);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .exercise-btn.active {
        background: var(--accent);
        border-color: rgba(255,255,255,0.28);
      }

      .feedback-box {
        margin-top: 12px;
        background: rgba(15, 23, 42, 0.74);
        border-radius: 12px;
        padding: 12px 14px;
        text-align: center;
        backdrop-filter: blur(5px);
      }

      .feedback-message {
        font-size: 16px;
        font-weight: 700;
        color: var(--white);
        line-height: 1.3;
      }

      .count-label {
        margin-top: 8px;
        font-size: 18px;
        color: #facc15;
        font-weight: 800;
      }

      .bottom-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        display: flex;
        justify-content: center;
        z-index: 3;
      }

      .action-btn {
        border: none;
        border-radius: 999px;
        padding: 16px 34px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: white;
        font-size: 18px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
      }

      .action-btn.stop {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
      }

      .status-badge {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 4;
        background: rgba(2, 6, 23, 0.7);
        color: var(--white);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 700;
      }

      .status-badge.live {
        color: #86efac;
      }

      .status-badge.offline {
        color: #fca5a5;
      }

      @media (max-width: 420px) {
        body { padding: 8px; }
        .phone-shell { width: 100vw; height: 100vh; border-radius: 0; padding: 0; }
        .phone-screen { border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone-screen">
        <div class="video-wrap">
          <video id="video" autoplay muted playsinline></video>
        </div>

        <div id="statusBadge" class="status-badge offline">OFFLINE</div>
        <div class="camera-overlay transparent" id="borderOverlay"></div>

        <div class="top-panel">
          <div class="exercise-row" id="exerciseRow"></div>

          <div class="feedback-box">
            <div class="feedback-message" id="feedbackMessage">원하는 운동을 고르고 촬영을 시작하세요.</div>
            <div class="count-label" id="countLabel" style="display: none;">0</div>
          </div>
        </div>
        
        <div class="bottom-panel">
          <button id="toggleBtn" class="action-btn">촬영 시작</button>
        </div>
      </div>
    </div>

    <script>
      const EXERCISES = ['풀업', '딥스', '푸쉬업', '플랭크', '사이드 런지'];
      const exerciseRow = document.getElementById('exerciseRow');
      const feedbackMessage = document.getElementById('feedbackMessage');
      const countLabel = document.getElementById('countLabel');
      const toggleBtn = document.getElementById('toggleBtn');
      const video = document.getElementById('video');
      const borderOverlay = document.getElementById('borderOverlay');
      const statusBadge = document.getElementById('statusBadge');

      let selectedExercise = '풀업';
      let stream = null;
      let socket = null;
      let frameTimer = null;
      let isStreaming = false;
      let countdownTimer = null;
      let countdownValue = 10;
      let currentFeedback = '원하는 운동을 고르고 촬영을 시작하세요.';

      const speechState = {
        currentType: null,
        feedbackActive: false,
        feedbackQueue: [],
        feedbackDelayTimer: null,
        pendingCount: null,
        latestSkippedCount: null,
        lastCount: 0
      };

      function renderExercises() {
        exerciseRow.innerHTML = '';
        EXERCISES.forEach((exercise) => {
          const button = document.createElement('button');
          button.className = 'exercise-btn' + (exercise === selectedExercise ? ' active' : '');
          button.textContent = exercise;
          button.onclick = () => {
            if (!isStreaming) {
              selectedExercise = exercise;
              renderExercises();
              feedbackMessage.textContent = `${exercise} 운동을 선택했습니다.`;
            }
          };
          exerciseRow.appendChild(button);
        });
      }

      function updateBorder(color = 'transparent') {
        borderOverlay.className = `camera-overlay ${color}`;
      }

      function updateStatus(connected) {
        statusBadge.textContent = connected ? 'LIVE' : 'OFFLINE';
        statusBadge.className = `status-badge ${connected ? 'live' : 'offline'}`;
      }

      function updateCountUi(count) {
        const normalized = Number(count);
        if (!Number.isFinite(normalized) || normalized < 0) return;

        countLabel.style.display = 'block';
        countLabel.textContent = `현재 횟수: ${normalized}`;
        feedbackMessage.textContent = `푸시업 ${normalized}회`;
        speechState.lastCount = normalized;
      }

      function ensureSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) return socket;

        socket = new WebSocket('ws://localhost:8000/api/video/ws/video');

        socket.onopen = () => {
          console.log('백엔드 WebSocket 연결 성공');
          updateStatus(true);
        };

        socket.onclose = () => {
          console.log('백엔드 WebSocket 연결 종료');
          updateStatus(false);
          isStreaming = false;
          toggleBtn.textContent = '촬영 시작';
          toggleBtn.classList.remove('stop');
          stopSpeechQueue();
          stopCamera();
        };

        socket.onerror = (error) => {
          console.error('WebSocket 오류:', error);
          feedbackMessage.textContent = '서버 연결에 실패했습니다. 백엔드가 실행 중인지 확인하세요.';
          updateStatus(false);
        };

        socket.onmessage = (event) => {
          try {
            const result = JSON.parse(event.data);
            const priority = Number(result.priority ?? 0);
            console.log('WebSocket 메시지 수신:', result);

            const isFeedbackMessage =
              result.status === 'feedback' ||
              result.type === 'feedback' ||
              Boolean(result.feedback) ||
              priority >= 100;

            const isCountMessage =
              result.status === 'count' ||
              result.type === 'count' ||
              result.signal === 'COUNT_SUCCESS' ||
              priority === 0;

            if (isCountMessage && !isFeedbackMessage) {
              const count = Number(result.count ?? 0);
              updateCountUi(count);

              if (speechState.currentType === 'feedback' || speechState.feedbackActive) {
                speechState.latestSkippedCount = count;
                console.log('피드백 중이므로 이번 카운트 발화는 스킵하고 최신 값만 저장합니다.');
                return;
              }

              if (speechState.currentType === 'count') {
                speechState.pendingCount = count;
                console.log('카운트 발화 중이므로 최신 값으로 대체합니다.');
                return;
              }

              triggerCountSpeech(count);
              return;
            }

            if (isFeedbackMessage) {
              const msg = result.feedback || result.message || '자세를 확인해주세요.';
              feedbackMessage.textContent = msg;
              currentFeedback = msg;
              updateBorder(result.color || 'transparent');
              speakExerciseFeedback(msg);
            }
          } catch (error) {
            console.log('WebSocket 메시지 파싱 실패:', error);
          }
        };

        return socket;
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          feedbackMessage.textContent = '이 브라우저는 웹캠을 지원하지 않습니다.';
          return;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

          video.srcObject = stream;
          await video.play();
          ensureSocket();
          startFrameLoop();
          isStreaming = true;
          toggleBtn.textContent = '촬영 중지';
          toggleBtn.classList.add('stop');
          feedbackMessage.textContent = `${selectedExercise} 운동을 시작합니다.`;
          updateBorder('transparent');
        } catch (error) {
          console.error('웹캠 접근 실패:', error);
          feedbackMessage.textContent = '웹캠 권한을 허용해 주세요.';
        }
      }

      function stopCamera() {
        if (frameTimer) {
          clearInterval(frameTimer);
          frameTimer = null;
        }

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }

        if (video) {
          video.srcObject = null;
        }

        isStreaming = false;
        countLabel.style.display = 'none';
        updateBorder('transparent');
      }

      function sendFrameToServer() {
        if (!socket || socket.readyState !== WebSocket.OPEN || !video || video.readyState < 2) return;

        const canvas = document.createElement('canvas');
        const width = 640;
        const height = 720;
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const base64 = dataUrl.split(',')[1];
        if (base64) {
          socket.send(base64);
        }
      }

      function startFrameLoop() {
        if (frameTimer) clearInterval(frameTimer);
        frameTimer = setInterval(sendFrameToServer, 200);
      }

      function toKoreanCount(value) {
        const map = ['영', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열', '열하나', '열둘', '열셋', '열넷', '열다섯', '열여섯', '열일곱', '열여덟', '열아홉', '스물'];
        return map[value] ?? String(value);
      }

      function triggerCountSpeech(count) {
        const normalized = Number(count);
        if (!Number.isFinite(normalized) || normalized < 0) return;

        if (speechState.currentType === 'feedback' || speechState.feedbackActive) {
          speechState.latestSkippedCount = normalized;
          console.log('피드백 중이라 이번 카운트는 스킵하고 최신 값만 저장합니다.');
          return;
        }

        if (speechState.currentType === 'count') {
          speechState.pendingCount = normalized;
          console.log('카운트 발화 중이라 최근 값을 대기열로 저장합니다.');
          return;
        }

        const utterance = new SpeechSynthesisUtterance(`푸시업 ${toKoreanCount(normalized)} 회`);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1;

        utterance.onstart = () => {
          speechState.currentType = 'count';
          speechState.feedbackActive = false;
        };

        utterance.onend = () => {
          if (speechState.currentType === 'count') {
            speechState.currentType = null;
          }

          if (speechState.pendingCount !== null) {
            const nextCount = speechState.pendingCount;
            speechState.pendingCount = null;
            triggerCountSpeech(nextCount);
            return;
          }

          if (speechState.feedbackQueue.length > 0) {
            const queuedFeedback = speechState.feedbackQueue.shift();
            scheduleFeedbackPlayback(queuedFeedback);
          }
        };

        utterance.onerror = utterance.onend;
        window.speechSynthesis.speak(utterance);
      }

      function scheduleFeedbackPlayback(text) {
        if (!text) return;

        if (speechState.feedbackDelayTimer) {
          clearTimeout(speechState.feedbackDelayTimer);
        }

        speechState.feedbackDelayTimer = setTimeout(() => {
          speechState.feedbackDelayTimer = null;

          if (speechState.currentType === 'count' || speechState.feedbackActive) {
            speechState.feedbackQueue.push(String(text));
            return;
          }

          playFeedbackUtterance(String(text));
        }, 1000);
      }

      function playFeedbackUtterance(text) {
        if (!text) return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.0;
        utterance.pitch = 1.2;
        utterance.volume = 1;

        utterance.onstart = () => {
          speechState.currentType = 'feedback';
          speechState.feedbackActive = true;
        };

        utterance.onend = () => {
          if (speechState.currentType === 'feedback') {
            speechState.currentType = null;
          }
          speechState.feedbackActive = false;

          if (speechState.latestSkippedCount !== null) {
            const nextCount = speechState.latestSkippedCount;
            speechState.latestSkippedCount = null;
            triggerCountSpeech(nextCount);
            return;
          }

          if (speechState.feedbackQueue.length > 0) {
            const nextFeedback = speechState.feedbackQueue.shift();
            scheduleFeedbackPlayback(nextFeedback);
          }
        };

        utterance.onerror = utterance.onend;
        window.speechSynthesis.speak(utterance);
      }

      function speakExerciseFeedback(text) {
        if (!text) return;

        speechState.feedbackQueue.push(String(text));

        if (speechState.currentType === 'count' || speechState.feedbackActive || speechState.currentType === 'feedback') {
          return;
        }

        const nextFeedback = speechState.feedbackQueue.shift();
        scheduleFeedbackPlayback(nextFeedback);
      }

      function stopSpeechQueue() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }

        if (speechState.feedbackDelayTimer) {
          clearTimeout(speechState.feedbackDelayTimer);
          speechState.feedbackDelayTimer = null;
        }

        speechState.currentType = null;
        speechState.feedbackActive = false;
        speechState.feedbackQueue = [];
        speechState.pendingCount = null;
        speechState.latestSkippedCount = null;
      }

      function speakText(text, options = {}) {
        const { rate = 1, pitch = 1 } = options;
        if (!text) return;

        if (!('speechSynthesis' in window)) {
          console.warn('브라우저 음성 API가 지원되지 않습니다.');
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = rate;
        utterance.pitch = pitch;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
      }

      function speakCountdown(count) {
        if (count <= 0) return;
        speakText(String(count), { rate: 1.0, pitch: 1.0 });
      }

      function startCountdown() {
        if (countdownTimer) clearInterval(countdownTimer);

        countdownValue = 10;
        feedbackMessage.textContent = '운동을 준비하세요. 10초 뒤 촬영을 시작합니다.';
        speakText('운동을 준비하세요. 10초 카운트다운을 시작합니다.');

        countdownTimer = setInterval(() => {
          countdownValue -= 1;
          if (countdownValue > 0) {
            feedbackMessage.textContent = `준비: ${countdownValue}초`;
            if (countdownValue <= 3) {
              speakCountdown(countdownValue);
            }
          }

          if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            feedbackMessage.textContent = '촬영을 시작합니다.';
            speakText('촬영을 시작합니다.');
            startCamera();
          }
        }, 1000);
      }

      function stopCountdown() {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function handleToggle() {
        if (isStreaming) {
          stopCamera();
          stopCountdown();
          stopSpeechQueue();
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
          }
          toggleBtn.textContent = '촬영 시작';
          toggleBtn.classList.remove('stop');
          feedbackMessage.textContent = '촬영이 종료되었습니다.';
          return;
        }

        if (!selectedExercise) {
          feedbackMessage.textContent = '먼저 운동을 선택하세요.';
          return;
        }

        startCountdown();
      }

      toggleBtn.addEventListener('click', handleToggle);

      renderExercises();
      updateStatus(false);
      feedbackMessage.textContent = '원하는 운동을 고르고 촬영을 시작하세요.';
    </script>
  </body>
</html>
